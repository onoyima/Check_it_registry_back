name: Deploy ProveOwnership Backend

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test -- --runInBand --forceExit

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          ssh -i ~/.ssh/deploy_key "prove-deploy@${{ secrets.VPS_HOST }}" \
            "mkdir -p /home/prove-deploy/apps/proveownership-backend"
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='uploads' \
            --exclude='logs' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "prove-deploy@${{ secrets.VPS_HOST }}:/home/prove-deploy/apps/proveownership-backend/"

      - name: Install production dependencies and restart
        run: |
          ssh -i ~/.ssh/deploy_key "prove-deploy@${{ secrets.VPS_HOST }}" \
            "cd /home/prove-deploy/apps/proveownership-backend && npm ci --omit=dev && (pm2 describe proveownership-api > /dev/null 2>&1 && pm2 restart proveownership-api --update-env || pm2 start app.js --name proveownership-api) && pm2 save"
